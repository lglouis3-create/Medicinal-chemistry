<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PHAR 4342 — Cumulative Final Drill</title>
<style>
:root{
  --ink:#16202E; --ink-2:#22303F; --paper:#FFFFFF; --surface:#F2F4F7;
  --line:#D3DAE3; --line-soft:#E7ECF1;
  --text:#16202E; --text-dim:#5A6878;
  --ok:#1B7F4B; --ok-bg:#E8F5ED; --bad:#B3261E; --bad-bg:#FCEBEA;
  --warn:#B26B00; --warn-bg:#FDF3E2; --accent:#2F5FA8; --accent-bg:#EAF0F9;
  --sik:#2F5FA8; --yen:#7A3E9D;
  /* heteroatom palette + highlight wash, used by the functional group atlas */
  --at-o:#C2402F; --at-n:#2B62B5; --at-s:#96700C; --at-p:#7A46B0; --at-x:#2C7A50;
  --wash:rgba(190,58,43,0.13);
  --r:10px; --maxw:860px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--surface); color:var(--text);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%;
}
.prose{font-family:Georgia,"Iowan Old Style","Source Serif 4",serif; line-height:1.62}
.gloss{color:var(--text-dim);font-size:.9em;font-style:italic}
.teach h5.tsec{margin:16px 0 4px;font-size:12.5px;font-weight:700;letter-spacing:.055em;
  text-transform:uppercase;color:var(--accent,#2E5C8A)}
.teach h5.tsec:first-of-type{margin-top:10px}
.teach .prose+h5.tsec{border-top:1px solid rgba(0,0,0,.07);padding-top:14px}
.teach .prose{margin:0 0 2px}
.prose .gloss{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:.86em}
button{font:inherit;cursor:pointer}
a{color:var(--accent)}

/* ---------- chrome ---------- */
header{
  background:var(--ink); color:#fff; padding:10px 16px;
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  position:sticky; top:0; z-index:40;
}
header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.2px}
header .who{font-size:12px;color:#9FB0C4;margin-left:auto;display:flex;gap:8px;align-items:center}
header .who button{background:#2A3A4D;color:#DCE6F2;border:1px solid #3B4F66;border-radius:6px;padding:3px 9px;font-size:12px}
nav{background:var(--ink-2);display:flex;gap:2px;padding:0 8px;overflow-x:auto;position:sticky;top:44px;z-index:39}
nav button{
  background:none;border:0;color:#9FB0C4;padding:10px 14px;font-size:14px;
  border-bottom:3px solid transparent;white-space:nowrap
}
nav button[aria-selected="true"]{color:#fff;border-bottom-color:#6FA0E8}
main{max-width:var(--maxw);margin:0 auto;padding:18px 14px 90px}
h2{font-size:20px;margin:0 0 4px}
h3{font-size:16px;margin:22px 0 8px}
.sub{color:var(--text-dim);font-size:14px;margin:0 0 18px}
.hide{display:none !important}

/* ---------- topic list ---------- */
.topic{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--r);
  margin-bottom:10px;overflow:hidden
}
.topic>summary{
  padding:13px 15px;display:flex;gap:10px;align-items:center;cursor:pointer;list-style:none
}
.topic>summary::-webkit-details-marker{display:none}
.topic>summary::before{content:"▸";color:var(--text-dim);font-size:13px;transition:transform .15s}
.topic[open]>summary::before{transform:rotate(90deg)}
.topic .tname{font-weight:600;flex:1;min-width:0}
.topic .tname small{display:block;font-weight:400;color:var(--text-dim);font-size:12.5px;margin-top:2px}
.tag{font-size:11px;padding:2px 7px;border-radius:20px;border:1px solid;white-space:nowrap}
.tag.sik{color:var(--sik);border-color:#BDD0EA;background:#F1F6FD}
.tag.yen{color:var(--yen);border-color:#DCC7EA;background:#F8F2FB}
.subs{border-top:1px solid var(--line-soft);padding:6px 8px 10px}
.subrow{
  display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:8px
}
.subrow:hover{background:var(--surface)}
.subrow .sname{flex:1;min-width:0;font-size:14.5px}
.subrow .sname small{display:block;color:var(--text-dim);font-size:12px}
.subrow button{
  background:var(--accent);color:#fff;border:0;border-radius:7px;padding:7px 13px;font-size:13px;font-weight:500
}
.subrow button.done{background:var(--ok)}
.meter{height:5px;background:var(--line-soft);border-radius:3px;overflow:hidden;width:64px;flex:none}
.meter i{display:block;height:100%;background:var(--ok)}
.counts{font-size:11.5px;color:var(--text-dim);white-space:nowrap;min-width:52px;text-align:right}

/* ---------- filter bar ---------- */
.filters{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:16px}
.filters .frow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.filters .frow:last-child{margin-bottom:0}
.filters label{font-size:12.5px;color:var(--text-dim);margin-right:2px}
.chip{
  border:1px solid var(--line);background:var(--paper);border-radius:20px;padding:5px 12px;font-size:13px;color:var(--text)
}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

/* ---------- quiz ---------- */
.qcard{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.qhead{
  padding:9px 14px;border-bottom:1px solid var(--line-soft);display:flex;gap:8px;
  align-items:center;flex-wrap:wrap;font-size:12px;color:var(--text-dim)
}
.qhead .spacer{flex:1}
.qbody{padding:16px}
.tdimg{margin:2px 0 10px;background:#fff;border:1px solid var(--line-soft);border-radius:6px}
.qprog{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line-soft);
  font-size:12px;color:var(--text-dim);background:var(--surface)}
.qprog .pbar{flex:1;height:5px;background:var(--line-soft);border-radius:3px;overflow:hidden;min-width:60px}
.qprog .pbar i{display:block;height:100%;background:var(--ok)}
.stem{font-size:17px;line-height:1.5;margin:0 0 14px}
.qimg{width:100%;background:#fff;border:1px solid var(--line-soft);border-radius:8px;margin:0 0 14px;display:block}
.opt{
  display:flex;gap:11px;width:100%;text-align:left;background:var(--paper);
  border:1px solid var(--line);border-radius:9px;padding:12px 13px;margin-bottom:9px;
  font-size:15px;line-height:1.45;color:var(--text)
}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-bg)}
.opt .k{
  flex:none;width:23px;height:23px;border-radius:5px;background:var(--surface);
  border:1px solid var(--line);display:grid;place-items:center;font-size:12.5px;font-weight:600;color:var(--text-dim)
}
.opt.pick-ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.pick-ok .k{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.pick-bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.pick-bad .k{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.reveal-ok{border-color:var(--ok)}
.opt.reveal-ok .k{background:var(--ok);color:#fff;border-color:var(--ok)}

/* ---------- select-all questions ---------- */
.sata{margin:0 0 10px;font-size:13px;color:var(--text-dim);padding:7px 11px;background:var(--surface);
  border-left:3px solid var(--accent);border-radius:0 6px 6px 0}
.opt.multi .k{font-size:17px;line-height:1;background:transparent;border-color:var(--line)}
.opt.multi.on{border-color:var(--accent);background:var(--accent-bg)}
.opt.multi.on .k{color:var(--accent);border-color:var(--accent)}
.opt.multi.pick-ok .k,.opt.multi.reveal-ok .k{background:var(--ok);color:#fff}
.opt.multi.pick-bad .k{background:var(--bad);color:#fff}
.tag.sata{color:#7A46B0;border-color:#DCC7EA;background:#F8F2FB}
.youpicked{font-style:normal;font-size:11.5px;color:var(--text-dim);margin-left:4px}

/* ---------- weak spots: what to do next ---------- */
.nextgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:11px;margin:0 0 22px}
.nextcard{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.nexthead{display:flex;flex-direction:column;gap:2px;margin-bottom:9px}
.nexthead b{font-size:14.5px}
.nexthead span{font-size:12px;color:var(--text-dim)}
.nextrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;
  border-top:1px dashed var(--line-soft);font-size:13.5px}
.nextrow i{font-style:normal;color:var(--text-dim);font-size:12.5px}
.btn.small{padding:6px 11px;font-size:13px}
.opt:disabled{cursor:default;opacity:1}

.why{margin-top:14px;border-top:1px solid var(--line-soft);padding-top:14px}
.why .verdict{font-size:15px;font-weight:600;margin:0 0 12px;display:flex;gap:8px;align-items:center}
.why .verdict.ok{color:var(--ok)} .why .verdict.bad{color:var(--bad)}
.wrow{display:flex;gap:10px;padding:10px 0;border-top:1px dashed var(--line-soft)}
.wrow:first-of-type{border-top:0}
.wrow .mark{flex:none;width:22px;height:22px;border-radius:5px;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
.wrow .mark.y{background:var(--ok)} .wrow .mark.n{background:var(--bad)}
.wrow .wtxt{font-size:14.5px;line-height:1.55}
.wrow .wtxt b{font-weight:600}
.teach{margin-top:14px;background:var(--accent-bg);border:1px solid #CFDDF0;border-radius:9px;padding:13px 15px}
.teach h4{margin:0 0 7px;font-size:13px;color:var(--accent);font-weight:600}
.teach p{margin:0;font-size:15px;line-height:1.62}
.tdiag{background:#fff;border:1px solid #CFDDF0;border-radius:7px;padding:10px;margin:0 0 11px;overflow-x:auto}
.tdiag svg{display:block;max-width:100%;height:auto;margin:0 auto}
.quote{display:block;font-style:italic;color:var(--text);margin-bottom:6px;font-size:13px}
.cite{
  margin-top:13px;font-size:12.5px;color:var(--text-dim);background:var(--surface);
  border-left:3px solid var(--line);padding:9px 11px;border-radius:0 7px 7px 0
}
.cite .srcflag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:4px;margin-right:6px;
  background:var(--warn-bg);color:var(--warn);border:1px solid #E8CFA2}
.qfoot{padding:12px 14px;border-top:1px solid var(--line-soft);display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 17px;font-size:15px;font-weight:500}
.btn.ghost{background:var(--paper);color:var(--text);border:1px solid var(--line)}
.btn.amber{background:var(--warn-bg);color:var(--warn);border:1px solid #E8CFA2}
.btn:disabled{opacity:.45;cursor:default}

/* ---------- dashboard ---------- */
.stat{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.stat div{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 15px;flex:1;min-width:110px}
.stat b{display:block;font-size:25px;line-height:1.1}
.stat span{font-size:12.5px;color:var(--text-dim)}
table.gap{width:100%;border-collapse:collapse;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;font-size:14px}
table.gap th,table.gap td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line-soft)}
table.gap th{background:var(--surface);font-size:12.5px;color:var(--text-dim);font-weight:600}
table.gap tr:last-child td{border-bottom:0}
.bar{height:7px;background:var(--line-soft);border-radius:4px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%}
.missq{background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--bad);border-radius:0 var(--r) var(--r) 0;padding:12px 14px;margin-bottom:9px}
.missq .mstem{font-size:14.5px;margin-bottom:6px}
.missq .mmeta{font-size:12px;color:var(--text-dim)}

/* ---------- exam ---------- */
.examhead{background:var(--ink);color:#fff;border-radius:var(--r);padding:13px 16px;margin-bottom:14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.examhead .clock{font-size:23px;font-weight:600;font-variant-numeric:tabular-nums}
.examhead .clock.low{color:#FF9A8F}
.examhead .prog{font-size:13px;color:#9FB0C4;margin-left:auto}

/* ---------- misc ---------- */
.note{background:var(--warn-bg);border:1px solid #E8CFA2;color:#6B4200;border-radius:var(--r);padding:12px 14px;font-size:13.5px;margin-bottom:16px}
.note b{color:#6B4200}
.empty{background:var(--paper);border:1px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--text-dim)}
.reftab{width:100%;border-collapse:collapse;background:var(--paper);border:1px solid var(--line);font-size:13.5px;margin-bottom:20px}
.reftab th,.reftab td{border:1px solid var(--line-soft);padding:8px 10px;text-align:left;vertical-align:top}
.reftab th{background:var(--surface);font-size:12.5px;font-weight:600}
.sweepcard{border-color:var(--accent);background:var(--accent-bg)}
.sweepcard .subs{border-top:0}
.sweepcard .subrow:hover{background:rgba(255,255,255,.5)}
.fgshow{background:#fff;border:1px solid var(--line-soft);border-radius:8px;
  padding:18px 12px;margin:0 0 15px;display:grid;place-items:center;min-height:120px}
.fgshow svg{max-width:100%;height:auto;color:var(--text)}

/* ---------- structures compared side by side ---------- */
.cmp{margin:0 0 14px}
.cmp h5{margin:0 0 9px;font-size:11.5px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--accent)}
.cmprow{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:9px}
.cmpcell{margin:0;background:#fff;border:1px solid #CFDDF0;border-radius:7px;
  padding:9px 8px;display:flex;flex-direction:column;gap:6px}
.cmpfig{display:grid;place-items:center;min-height:86px}
.cmpfig svg{max-width:100%;height:auto;color:var(--text)}
.cmpcell figcaption{font-size:12.5px;line-height:1.35;color:var(--text)}
.cmpcell figcaption b{display:block;font-weight:600}
.cmpcell figcaption span{display:block;margin-top:3px;font-size:11.5px;
  line-height:1.4;color:var(--text-dim)}
.cmpcell figcaption .alt{font-weight:400;color:var(--text-dim)}
.cmpcell.is-ok{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.cmpcell figcaption i{display:block;font-style:normal;font-weight:600;font-size:10.5px;
  letter-spacing:.07em;text-transform:uppercase;color:var(--ok);margin-top:2px}

/* one option's structure, beside its explanation */
.wrow{align-items:flex-start}
.wfig{flex:0 0 auto;margin-left:10px;padding:5px 6px;background:#fff;
  border:1px solid var(--line-soft);border-radius:6px;display:grid;place-items:center;
  min-width:64px}
.wfig svg{max-width:100%;height:auto;color:var(--text)}
@media (max-width:620px){
  .wrow{flex-wrap:wrap}
  .wfig{margin:7px 0 0 26px}
}
.teach .fgshow{background:#fff;border-color:#CFDDF0;margin-bottom:11px}

/* ---------- functional group atlas ---------- */
.atbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--paper);
  border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;margin-bottom:16px;
  position:sticky;top:88px;z-index:30}
.atbar input{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:7px;
  padding:6px 10px;width:190px;background:var(--paper);color:var(--text)}
.atbar .spacer{flex:1}
.atboard{margin-bottom:30px;scroll-margin-top:150px}
.atboard h3{border-top:2px solid var(--ink);padding-top:12px;margin:0 0 4px}
.atboard .bintro{font-size:13.5px;color:var(--text-dim);margin:0 0 14px;max-width:44rem}
.atsub{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--text-dim);
  border-bottom:1px solid var(--line-soft);padding-bottom:5px;margin:18px 0 11px}
.atgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:11px}
.attile{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px;
  display:flex;flex-direction:column;gap:7px}
.attile[hidden]{display:none}
.atfig{display:grid;place-items:center;min-height:92px;background:var(--surface);
  border-radius:5px;padding:7px;position:relative}
.atfig svg{max-width:100%;height:auto;display:block;color:var(--text)}
.atname{font-size:14px;font-weight:600;line-height:1.25}
.atname .alt{font-weight:400;color:var(--text-dim)}
.attell{font-size:12.5px;line-height:1.45;color:var(--text-dim);margin:0}
.attell b{color:var(--text);font-weight:600}
.ateg{font-size:11px;color:var(--text-dim);margin:0;font-style:italic}
.ateg::before{content:"e.g. ";opacity:.7}
.atnote{border-left:3px solid var(--accent);padding:3px 0 3px 13px;margin:16px 0 0;
  font-size:14px;color:var(--text);max-width:44rem;background:var(--accent-bg);
  border-radius:0 6px 6px 0;padding-right:12px;padding-top:9px;padding-bottom:9px}
.attell code,.atnote code,.bintro code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:.88em;background:var(--surface);padding:1px 4px;border-radius:3px;color:var(--text)}
/* Recall mode collapses the text rather than just hiding it. Leaving the boxes
   at full height puts a screen of white space between the structures, which is
   the opposite of what going along a row quickly needs. */
#v-atlas.namesoff .atgrid{align-items:start}
#v-atlas.namesoff .atname,#v-atlas.namesoff .attell,#v-atlas.namesoff .ateg{display:none}
#v-atlas.namesoff .attile.shown .atname,#v-atlas.namesoff .attile.shown .attell{display:block}
#v-atlas.namesoff .attile.shown .ateg{display:block}
#v-atlas.namesoff .atfig{cursor:pointer}
#v-atlas.namesoff .atfig::after{content:"name it";position:absolute;bottom:3px;right:7px;
  font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
#v-atlas.namesoff .attile.shown .atfig::after{content:""}
/* objective guides */
.gobj{margin:0 0 34px;padding:0 0 22px;border-bottom:2px solid var(--line)}
.gobj h3{margin:26px 0 10px;font-size:19px}
.gobj h4{margin:20px 0 8px;font-size:14.5px;color:var(--accent);letter-spacing:.01em}
.gbar{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;background:var(--accent);color:#fff;border-radius:8px;padding:9px 14px;margin:0 0 6px}
.gbar span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.gbar b{font-size:15px}
.gbar i{margin-left:auto;font-size:12.5px;opacity:.9}
.gwords{display:grid;grid-template-columns:minmax(120px,max-content) 1fr;gap:5px 14px;margin:0 0 10px;font-size:13.5px}
.gwords dt{font-weight:600}
.gwords dd{margin:0;color:var(--text)}
.gobj .prose{font-size:14.5px;margin:0 0 10px}
.gobj .reftab{margin:8px 0 14px}
.gobj .reffig img{max-width:620px;width:100%}
.ghook,.gpoll,.gask{border:1px solid;border-radius:9px;padding:11px 14px;margin:14px 0;font-size:14px;line-height:1.55}
.ghook{border-color:#d9822b;background:rgba(217,130,43,.08)}
.gpoll{border-color:#3b62c4;background:rgba(59,98,196,.07)}
.gask{border-color:#2f8f5b;background:rgba(47,143,91,.07)}
.ghook>b,.gpoll>b,.gask>b{display:block;margin-bottom:4px}
.gask ul{margin:6px 0 6px 18px;padding:0}
.gask li{margin:3px 0}
@media (max-width:600px){.gwords{grid-template-columns:1fr}.gwords dd{margin:0 0 6px 10px}}
.refnav-wrap{margin:0 0 20px;border:1px solid var(--line-soft);border-radius:8px;background:var(--surface)}
.refnav-wrap summary{cursor:pointer;padding:10px 14px;font-size:13.5px;font-weight:600;color:var(--accent);list-style:none}
.refnav-wrap summary::-webkit-details-marker{display:none}
.refnav-wrap summary::before{content:"\25B8  ";font-size:11px}
.refnav-wrap[open] summary::before{content:"\25BE  "}
.refnav{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:4px 14px 14px}
.refnav a{font-size:12.5px;padding:4px 9px;border:1px solid var(--line);border-radius:999px;
  background:var(--paper);color:var(--text);text-decoration:none;white-space:nowrap}
.refnav a:hover{background:var(--line-soft)}
.reffig{margin:0 0 20px;padding:0}
.reffig img{width:100%;max-width:760px;display:block;border:1px solid var(--line-soft);border-radius:6px;background:#fff}
.reffig figcaption{font-size:12.5px;color:var(--text-dim);margin-top:6px}
#v-ref h3{scroll-margin-top:12px}
input[type=text]{font:inherit;padding:8px 11px;border:1px solid var(--line);border-radius:7px;background:var(--paper);color:var(--text)}

<body>

<header>
  <h1>PHAR 4342 — Cumulative Final</h1>

<main>
  <section id="v-topics"></section>
  <section id="v-quiz" class="hide"></section>
  <section id="v-gaps" class="hide"></section>
  <section id="v-exam" class="hide"></section>
  <section id="v-atlas" class="hide"></section>

<script>
/* ==========================================================================
   DATA  (injected at build time)
   ========================================================================== */
const IMAGES = /*__IMAGES__*/{};
const QUESTIONS = /*__QUESTIONS__*/[];
const TOPICS = /*__TOPICS__*/[];

/* ==========================================================================
   STORAGE — namespaced per profile so several people can share one browser
   ========================================================================== */
const NS = 'phar4342final';

/* localStorage is not always reachable. Opening this file from disk can give
   the page an opaque origin, and a private window or blocked site data does the
   same, in which case even reading localStorage throws a SecurityError. That
   throw used to happen while the script was still evaluating, which killed the
   whole app and left a blank page. Everything now goes through this shim: when
   storage is unavailable the drill still runs for the session, and only the
   saving of progress is lost. */
const LS = (() => {
  let ok = true;
  try { const k = NS + ':probe'; localStorage.setItem(k, '1'); localStorage.removeItem(k); }
  catch(e) { ok = false; }
  const mem = {};
  return {
    available: ok,
    get(k){ try { return ok ? localStorage.getItem(k) : (k in mem ? mem[k] : null); }
            catch(e){ return null; } },
    set(k, v){ try { if(ok) localStorage.setItem(k, v); else mem[k] = v; return true; }
               catch(e){ mem[k] = v; return false; } },
  };
})();

let PROFILE = LS.get(NS + ':profile') || '';
const keyFor = p => NS + ':data:' + p;

const BLANK = () => ({
  concepts:{},        // conceptId -> {seen,correct,wrong,guessed,streak,box,dueAt,dueQ,lastQ,asked:[]}
  answers:[],         // {qid,concept,result,at,qn,picked,ms}
                      //   picked: option index, or a sorted array of indices for a
                      //   select-all question; ms: time from render to answer.
                      //   Which wrong option was chosen is the most diagnostic
                      //   signal the app has, so it is kept.
  qn:0,               // questions answered counter (drives cram scheduling)
  settings:{mode:'cram'},
  created:Date.now()
});
let DB = BLANK();

function load(){
  if(!PROFILE) return;
  try{
    const raw = LS.get(keyFor(PROFILE));
    DB = raw ? Object.assign(BLANK(), JSON.parse(raw)) : BLANK();
  }catch(e){ DB = BLANK(); }
}
let saveTimer=null;
function save(){
  if(!PROFILE) return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    LS.set(keyFor(PROFILE), JSON.stringify(DB));
  },150);
}
function askProfile(force){
  let n = PROFILE;
  if(force || !n){
    n = (prompt(
      'Your name or initials.\n\n'+
      'This keeps your progress separate from anyone else using this same browser. '+
      'Nothing is sent anywhere — it stays on this device.', PROFILE||'') || '').trim();
    if(!n) n = PROFILE || 'me';
  }
  PROFILE = n;
  LS.set(NS+':profile', PROFILE);
  load();
  const who = document.getElementById('whoName');
  if(who) who.textContent = PROFILE + (LS.available ? '' : ' (progress not saved)');
}

/* ==========================================================================
   SPACED REPETITION
   Rules implemented (Louis's spec):
     1 correct  -> longer interval each time, never retired permanently
     2 wrong    -> stays in active review, resurfaces after >=GAP other questions,
                   prefers a DIFFERENT question on the same concept
     3 guessed  -> treated as not-yet-understood: box drops to 0 so it ranks
                   with missed concepts, ahead of never-seen material
     4 spaced   -> mastered material returns at growing intervals
     5 priority -> wrong > due > never-seen > recently mastered
     6 concept-level tracking, not wording-level
     7 mastery  -> needs repeated correct answers on separate occasions
   ========================================================================== */
const GAP = 4;                                   // min other questions before a missed concept returns
const DAYS = [0, 1, 3, 7, 14, 30, 60];           // long-term schedule (box index -> days)
const CRAM = [0, 8, 20, 45, 90, 160, 260];       // cram schedule (box index -> questions answered)
const MASTER_BOX = 3;                            // box at/above which a concept counts as mastered

function st(concept){
  if(!DB.concepts[concept]){
    DB.concepts[concept] = {seen:0,correct:0,wrong:0,guessed:0,streak:0,box:0,
                            dueAt:0,dueQ:0,lastQ:-999,asked:[]};
  }
  return DB.concepts[concept];
}
const cram = () => (DB.settings.mode||'cram') === 'cram';

function schedule(s){
  const b = Math.max(0, Math.min(s.box, DAYS.length-1));
  s.dueQ  = DB.qn + CRAM[b];
  s.dueAt = Date.now() + DAYS[b]*86400000;
}
function isDue(s){
  return cram() ? (DB.qn >= s.dueQ) : (Date.now() >= s.dueAt);
}
function record(q, result, picked, ms){   // result: 'correct' | 'wrong' | 'guessed'
  const s = st(q.concept);
  DB.qn++;
  s.seen++;
  s.lastQ = DB.qn;
  if(!s.asked.includes(q.id)) s.asked.push(q.id);

  if(result === 'correct'){
    s.correct++; s.streak++;
    s.box = Math.min(s.box + 1, DAYS.length - 1);
  }else if(result === 'guessed'){
    s.guessed++;                     // the right pick, but not understood
    s.streak = 0;
    s.box = 0;                       // rule 3: a guess is a gap, so it ranks with misses
  }else{
    s.wrong++; s.streak = 0;
    s.box = 0;                       // rule 4: a miss resets to active review
  }
  schedule(s);
  const entry = {qid:q.id, concept:q.concept, result, at:Date.now(), qn:DB.qn};
  if(picked !== undefined && picked !== null) entry.picked = picked;
  if(ms) entry.ms = ms;
  DB.answers.push(entry);
  if(DB.answers.length > 4000) DB.answers.splice(0, DB.answers.length-4000);
  save();
}

/* Marking a correct answer as a guess after the fact. The correct path has
   already advanced the box; this pulls the concept back to unresolved and
   rewrites the logged result, so the answer log and the concept state agree. */
function markGuessed(q){
  const last = DB.answers[DB.answers.length-1];
  const s = st(q.concept);
  if(last && last.qid === q.id && last.result === 'correct'){
    last.result = 'guessed';
    s.guessed++; s.correct = Math.max(0, s.correct - 1); s.streak = 0;
    s.box = 0;
    schedule(s); save();
    return true;
  }
  return false;
}

/* Select-all questions carry more than one correct option and are marked
   all-or-nothing, which is how a select-all item is scored on the paper. */
const isMulti = q => !!q.multi;
const correctSet = q => q.options.map((o,i) => o.correct ? i : -1).filter(i => i >= 0);
function gradeMulti(q, picks){
  const want = correctSet(q), got = (picks || []).slice().sort((a,b)=>a-b);
  return want.length === got.length && want.every((v,i) => v === got[i]);
}

/** Rank one candidate question. Higher score = ask sooner. */
function score(q){
  const s = DB.concepts[q.concept];
  if(!s) return {tier:3, sub:0};                       // never tested
  const cooled = (DB.qn - s.lastQ) >= GAP;
  if(s.box === 0 && s.seen > 0){                       // missed / unresolved
    if(!cooled) return null;                           // too soon — rule 2
    return {tier:4, sub: s.wrong*10 + s.guessed*5};
  }
  if(isDue(s)) return {tier:2, sub: 6 - s.box};        // due for spaced review
  // Answered correctly and not yet due. Rule 1 says do not repeat it. Only the
  // explicit "Ask everything" setting overrides that, and then oldest-first.
  if((DB.settings.mode||'cram') !== 'all') return null;
  return {tier:1, sub: -s.lastQ};
}

/**
 * Pick the next question from a pool.
 * Prefers a question on the concept that has NOT been asked before (rule 2/6:
 * re-test the concept with different wording rather than the identical item).
 */
function pickNext(pool, justAsked){
  const cands = [];
  for(const q of pool){
    if(justAsked && q.id === justAsked) continue;
    const sc = score(q);
    if(!sc) continue;
    const s = DB.concepts[q.concept];
    const fresh = !s || !s.asked.includes(q.id);       // unseen wording of this concept
    cands.push({q, tier:sc.tier, sub:sc.sub, fresh:fresh?1:0, r:Math.random()});
  }
  if(!cands.length) return null;
  cands.sort((a,b)=>
      b.tier - a.tier
   || b.fresh - a.fresh
   || b.sub  - a.sub
   || a.r    - b.r);
  // sample from the top of the ranked list so the order is not identical every run
  let top = cands.filter(c => c.tier===cands[0].tier && c.fresh===cands[0].fresh);
  // Rule 5 puts a missed concept ahead of a never-seen one. Taken literally,
  // a pool with many open misses serves them back to back and the never-seen
  // material waits, so the "not yet seen" count in Weak spots stands still
  // while the retests cycle. A missed concept now takes at most every other
  // turn: after one retest the next pick goes to never-seen material when any
  // remains in the pool. The GAP rule still holds for each concept.
  if(cands[0].tier === 4 && LAST_TIER === 4){
    const unseen = cands.filter(c => c.tier === 3);
    if(unseen.length) top = unseen;
  }
  const pick = top[Math.floor(Math.random()*Math.min(top.length,5))];
  LAST_TIER = pick.tier;
  return pick.q;
}
let LAST_TIER = 0;   // tier of the question pickNext served last (4 = a missed concept's retest)

/* ==========================================================================
   HELPERS
   ========================================================================== */
const $  = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LETTERS = 'ABCDEFGHIJ';
const byId = id => QUESTIONS.find(q=>q.id===id);
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; };

function conceptsIn(pool){ return [...new Set(pool.map(q=>q.concept))]; }
/** Concepts in a pool that are still waiting: never seen, missed, or due again. */
function remainingIn(pool){
  let n = 0;
  for(const c of conceptsIn(pool)){
    const st = DB.concepts[c];
    if(!st || !st.seen || st.box === 0 || isDue(st)) n++;
  }
  return n;
}
function masteryOf(pool){
  const cs = conceptsIn(pool);
  let m=0, t=0;
  for(const c of cs){
    const s = DB.concepts[c];
    if(s && s.seen) t++;
    if(s && s.box >= MASTER_BOX) m++;
  }
  return {mastered:m, touched:t, total:cs.length};
}
/* Exam weight per question. The paper is 50 questions: 38 from the Sikazwe
   new pool, 8 Yendapally, 4 Sikazwe old. Dividing each pool's share of the
   paper by the number of questions in that pool gives the marks each one
   question stands for, which is what a miss actually costs. */
const BLUEPRINT = {'Sikazwe|new':38, 'Yendapally|old':8, 'Sikazwe|old':4};
const poolKey = q => q.prof + '|' + q.tier;
const POOL_SIZE = (() => { const n = {}; QUESTIONS.forEach(q => { n[poolKey(q)] = (n[poolKey(q)]||0) + 1; }); return n; })();
function markWeight(q){
  const k = poolKey(q);
  return (BLUEPRINT[k] || 0) / (POOL_SIZE[k] || 1);
}

function profTag(p){
  return p==='Sikazwe'
    ? '<span class="tag sik">Sikazwe</span>'
    : '<span class="tag yen">Yendapally</span>';
}
</script>
