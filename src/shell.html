<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F5FA8">
<!-- Installable from the hosted site. build.py writes the manifest and icons
     beside the page; opened from disk the drill is self-contained either way. -->
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>Exam drill</title>
<style>
:root{
  --ink:#16202E; --ink-2:#22303F; --paper:#FFFFFF; --surface:#F2F4F7;
  --line:#D3DAE3; --line-soft:#E7ECF1;
  --text:#16202E; --text-dim:#5A6878;
  --ok:#1B7F4B; --ok-bg:#E8F5ED; --bad:#B3261E; --bad-bg:#FCEBEA;
  --warn:#B26B00; --warn-bg:#FDF3E2; --accent:#2F5FA8; --accent-bg:#EAF0F9;
  --sik:#2F5FA8; --yen:#7A3E9D;
  /* heteroatom palette + highlight wash, used by the functional group atlas */
  --at-o:#C2402F; --at-n:#2B62B5; --at-s:#96700C; --at-p:#7A46B0; --at-x:#2C7A50;
  --wash:rgba(190,58,43,0.13);
  --r:10px; --maxw:860px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--surface); color:var(--text);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%;
}
.prose{font-family:Georgia,"Iowan Old Style","Source Serif 4",serif; line-height:1.62}
.gloss{color:var(--text-dim);font-size:.9em;font-style:italic}
.teach h5.tsec{margin:16px 0 4px;font-size:12.5px;font-weight:700;letter-spacing:.055em;
  text-transform:uppercase;color:var(--accent,#2E5C8A)}
.teach h5.tsec:first-of-type{margin-top:10px}
.teach .prose+h5.tsec{border-top:1px solid rgba(0,0,0,.07);padding-top:14px}
.teach .prose{margin:0 0 2px}
.prose .gloss{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:.86em}
button{font:inherit;cursor:pointer}
a{color:var(--accent)}

/* ---------- chrome ---------- */
header{
  background:var(--ink); color:#fff; padding:10px 16px;
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  position:sticky; top:0; z-index:40;
}
header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.2px}
header .who{font-size:12px;color:#9FB0C4;margin-left:auto;display:flex;gap:8px;align-items:center}
header .who button{background:#2A3A4D;color:#DCE6F2;border:1px solid #3B4F66;border-radius:6px;padding:3px 9px;font-size:12px}
nav{background:var(--ink-2);display:flex;gap:2px;padding:0 8px;overflow-x:auto;position:sticky;top:44px;z-index:39}
nav button{
  background:none;border:0;color:#9FB0C4;padding:10px 14px;font-size:14px;
  border-bottom:3px solid transparent;white-space:nowrap
}
nav button[aria-selected="true"]{color:#fff;border-bottom-color:#6FA0E8}
main{max-width:var(--maxw);margin:0 auto;padding:18px 14px 90px}
h2{font-size:20px;margin:0 0 4px}
h3{font-size:16px;margin:22px 0 8px}
.sub{color:var(--text-dim);font-size:14px;margin:0 0 18px}
.hide{display:none !important}

/* ---------- topic list ---------- */
.topic{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--r);
  margin-bottom:10px;overflow:hidden
}
.topic>summary{
  padding:13px 15px;display:flex;gap:10px;align-items:center;cursor:pointer;list-style:none
}
.topic>summary::-webkit-details-marker{display:none}
.topic>summary::before{content:"▸";color:var(--text-dim);font-size:13px;transition:transform .15s}
.topic[open]>summary::before{transform:rotate(90deg)}
.topic .tname{font-weight:600;flex:1;min-width:0}
.topic .tname small{display:block;font-weight:400;color:var(--text-dim);font-size:12.5px;margin-top:2px}
.tag{font-size:11px;padding:2px 7px;border-radius:20px;border:1px solid;white-space:nowrap}
.tag.sik{color:var(--sik);border-color:#BDD0EA;background:#F1F6FD}
.tag.yen{color:var(--yen);border-color:#DCC7EA;background:#F8F2FB}
.tag.p3{background:#eef6ee;color:#2f6b3a;border-color:#bfe0c4}
.tag.p4{background:#f6eef6;color:#6b2f66;border-color:#dfbfdc}
.subs{border-top:1px solid var(--line-soft);padding:6px 8px 10px}
.subrow{
  display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:8px
}
.subrow:hover{background:var(--surface)}
.subrow .sname{flex:1;min-width:0;font-size:14.5px}
.subrow .sname small{display:block;color:var(--text-dim);font-size:12px}
.subrow button{
  background:var(--accent);color:#fff;border:0;border-radius:7px;padding:7px 13px;font-size:13px;font-weight:500
}
.subrow button.done{background:var(--ok)}
.meter{height:5px;background:var(--line-soft);border-radius:3px;overflow:hidden;width:64px;flex:none}
.meter i{display:block;height:100%;background:var(--ok)}
.counts{font-size:11.5px;color:var(--text-dim);white-space:nowrap;min-width:52px;text-align:right}

/* ---------- filter bar ---------- */
.filters{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:16px}
.filters .frow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.filters .frow:last-child{margin-bottom:0}
.filters label{font-size:12.5px;color:var(--text-dim);margin-right:2px}
.chip{
  border:1px solid var(--line);background:var(--paper);border-radius:20px;padding:5px 12px;font-size:13px;color:var(--text)
}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

/* ---------- quiz ---------- */
.qcard{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.qhead{
  padding:9px 14px;border-bottom:1px solid var(--line-soft);display:flex;gap:8px;
  align-items:center;flex-wrap:wrap;font-size:12px;color:var(--text-dim)
}
.qhead .spacer{flex:1}
.qbody{padding:16px}
.tdimg{margin:2px 0 10px;background:#fff;border:1px solid var(--line-soft);border-radius:6px}
.qprog{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line-soft);
  font-size:12px;color:var(--text-dim);background:var(--surface)}
.qprog .pbar{flex:1;height:5px;background:var(--line-soft);border-radius:3px;overflow:hidden;min-width:60px}
.qprog .pbar i{display:block;height:100%;background:var(--ok)}
.stem{font-size:17px;line-height:1.5;margin:0 0 14px}
.qimg{width:100%;background:#fff;border:1px solid var(--line-soft);border-radius:8px;margin:0 0 14px;display:block}
.opt{
  display:flex;gap:11px;width:100%;text-align:left;background:var(--paper);
  border:1px solid var(--line);border-radius:9px;padding:12px 13px;margin-bottom:9px;
  font-size:15px;line-height:1.45;color:var(--text)
}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-bg)}
.opt .k{
  flex:none;width:23px;height:23px;border-radius:5px;background:var(--surface);
  border:1px solid var(--line);display:grid;place-items:center;font-size:12.5px;font-weight:600;color:var(--text-dim)
}
.opt.pick-ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.pick-ok .k{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.pick-bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.pick-bad .k{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.reveal-ok{border-color:var(--ok)}
.opt.reveal-ok .k{background:var(--ok);color:#fff;border-color:var(--ok)}

/* ---------- select-all questions ---------- */
.sata{margin:0 0 10px;font-size:13px;color:var(--text-dim);padding:7px 11px;background:var(--surface);
  border-left:3px solid var(--accent);border-radius:0 6px 6px 0}
.opt.multi .k{font-size:17px;line-height:1;background:transparent;border-color:var(--line)}
.opt.multi.on{border-color:var(--accent);background:var(--accent-bg)}
.opt.multi.on .k{color:var(--accent);border-color:var(--accent)}
.opt.multi.pick-ok .k,.opt.multi.reveal-ok .k{background:var(--ok);color:#fff}
.opt.multi.pick-bad .k{background:var(--bad);color:#fff}
.tag.sata{color:#7A46B0;border-color:#DCC7EA;background:#F8F2FB}
.youpicked{font-style:normal;font-size:11.5px;color:var(--text-dim);margin-left:4px}

/* ---------- weak spots: what to do next ---------- */
.nextgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:11px;margin:0 0 22px}
.nextcard{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.nexthead{display:flex;flex-direction:column;gap:2px;margin-bottom:9px}
.nexthead b{font-size:14.5px}
.nexthead span{font-size:12px;color:var(--text-dim)}
.nextrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;
  border-top:1px dashed var(--line-soft);font-size:13.5px}
.nextrow i{font-style:normal;color:var(--text-dim);font-size:12.5px}
.btn.small{padding:6px 11px;font-size:13px}
.opt:disabled{cursor:default;opacity:1}

.why{margin-top:14px;border-top:1px solid var(--line-soft);padding-top:14px}
.why .verdict{font-size:15px;font-weight:600;margin:0 0 12px;display:flex;gap:8px;align-items:center}
.why .verdict.ok{color:var(--ok)} .why .verdict.bad{color:var(--bad)}
.wrow{display:flex;gap:10px;padding:10px 0;border-top:1px dashed var(--line-soft)}
.wrow:first-of-type{border-top:0}
.wrow .mark{flex:none;width:22px;height:22px;border-radius:5px;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
.wrow .mark.y{background:var(--ok)} .wrow .mark.n{background:var(--bad)}
.wrow .wtxt{font-size:14.5px;line-height:1.55}
.wrow .wtxt b{font-weight:600}
.teach{margin-top:14px;background:var(--accent-bg);border:1px solid #CFDDF0;border-radius:9px;padding:13px 15px}
.teach h4{margin:0 0 7px;font-size:13px;color:var(--accent);font-weight:600}
.teach p{margin:0;font-size:15px;line-height:1.62}
.tdiag{background:#fff;border:1px solid #CFDDF0;border-radius:7px;padding:10px;margin:0 0 11px;overflow-x:auto}
.tdiag svg{display:block;max-width:100%;height:auto;margin:0 auto}
.quote{display:block;font-style:italic;color:var(--text);margin-bottom:6px;font-size:13px}
.cite{
  margin-top:13px;font-size:12.5px;color:var(--text-dim);background:var(--surface);
  border-left:3px solid var(--line);padding:9px 11px;border-radius:0 7px 7px 0
}
.cite .srcflag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:4px;margin-right:6px;
  background:var(--warn-bg);color:var(--warn);border:1px solid #E8CFA2}
.qfoot{padding:12px 14px;border-top:1px solid var(--line-soft);display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 17px;font-size:15px;font-weight:500}
.btn.ghost{background:var(--paper);color:var(--text);border:1px solid var(--line)}
.btn.amber{background:var(--warn-bg);color:var(--warn);border:1px solid #E8CFA2}
.btn:disabled{opacity:.45;cursor:default}

/* ---------- dashboard ---------- */
.stat{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.stat div{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 15px;flex:1;min-width:110px}
.stat b{display:block;font-size:25px;line-height:1.1}
.stat span{font-size:12.5px;color:var(--text-dim)}
table.gap{width:100%;border-collapse:collapse;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;font-size:14px}
table.gap th,table.gap td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line-soft)}
table.gap th{background:var(--surface);font-size:12.5px;color:var(--text-dim);font-weight:600}
table.gap tr:last-child td{border-bottom:0}
.bar{height:7px;background:var(--line-soft);border-radius:4px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%}
.missq{background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--bad);border-radius:0 var(--r) var(--r) 0;padding:12px 14px;margin-bottom:9px}
.missq .mstem{font-size:14.5px;margin-bottom:6px}
.missq .mmeta{font-size:12px;color:var(--text-dim)}

/* ---------- exam ---------- */
.examhead{background:var(--ink);color:#fff;border-radius:var(--r);padding:13px 16px;margin-bottom:14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.examhead .clock{font-size:23px;font-weight:600;font-variant-numeric:tabular-nums}
.examhead .clock.low{color:#FF9A8F}
.examhead .prog{font-size:13px;color:#9FB0C4;margin-left:auto}

/* ---------- the bar along the bottom: a newer version, saved for offline use ---------- */
#swbar{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(12px + env(safe-area-inset-bottom));z-index:60;
  display:flex;align-items:center;gap:10px;width:max-content;max-width:calc(100% - 24px);
  background:var(--ink);color:#fff;border-radius:var(--r);padding:8px 8px 8px 14px;
  font-size:14px;line-height:1.35;box-shadow:0 6px 24px rgba(22,32,46,.28)}
#swbar button{background:var(--accent);color:#fff;border:0;border-radius:6px;
  padding:6px 12px;font-size:14px;font-weight:600;flex:none;cursor:pointer}
#swbar .swx{background:none;color:#9FB0C4;font-size:20px;line-height:1;padding:2px 6px;font-weight:400}
body.swbar-on{padding-bottom:76px}

/* ---------- the Home Screen card: a section in Settings that starts closed ---------- */
.hs-card{border-left:4px solid var(--accent)}
.hs-card>summary{display:flex;gap:8px;align-items:baseline;cursor:pointer;list-style:none;font-weight:600}
.hs-card>summary::-webkit-details-marker{display:none}
.hs-card>summary::before{content:"\25B8";color:var(--text-dim);font-size:13px}
.hs-card[open]>summary::before{content:"\25BE"}
.hs-steps{margin:4px 0 10px;padding-left:1.3em;font-size:13.5px;color:var(--text-dim)}
.hs-steps li{margin:4px 0}

/* ---------- the notice shown once when the browser refuses to save ---------- */
#savewarn{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:50;
  max-width:720px;margin:0 auto;background:var(--warn-bg);color:var(--text);border:1px solid var(--warn);
  border-radius:8px;padding:10px 12px;font-size:14px;line-height:1.45;box-shadow:0 2px 10px rgba(0,0,0,.25)}
#savewarn .btn{margin-left:8px;padding:4px 10px;font-size:13px}

/* ---------- misc ---------- */
.note{background:var(--warn-bg);border:1px solid #E8CFA2;color:#6B4200;border-radius:var(--r);padding:12px 14px;font-size:13.5px;margin-bottom:16px}
.note b{color:#6B4200}
.empty{background:var(--paper);border:1px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--text-dim)}
.reftab{width:100%;border-collapse:collapse;background:var(--paper);border:1px solid var(--line);font-size:13.5px;margin-bottom:20px}
.reftab th,.reftab td{border:1px solid var(--line-soft);padding:8px 10px;text-align:left;vertical-align:top}
.reftab th{background:var(--surface);font-size:12.5px;font-weight:600}
.sweepcard{border-color:var(--accent);background:var(--accent-bg)}
.sweepcard .subs{border-top:0}
.sweepcard .subrow:hover{background:rgba(255,255,255,.5)}
.fgshow{background:#fff;border:1px solid var(--line-soft);border-radius:8px;
  padding:18px 12px;margin:0 0 15px;display:grid;place-items:center;min-height:120px}
.fgshow svg{max-width:100%;height:auto;color:var(--text)}

/* ---------- structures compared side by side ---------- */
.cmp{margin:0 0 14px}
.cmp h5{margin:0 0 9px;font-size:11.5px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--accent)}
.cmprow{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:9px}
.cmpcell{margin:0;background:#fff;border:1px solid #CFDDF0;border-radius:7px;
  padding:9px 8px;display:flex;flex-direction:column;gap:6px}
.cmpfig{display:grid;place-items:center;min-height:86px}
.cmpfig svg{max-width:100%;height:auto;color:var(--text)}
.cmpcell figcaption{font-size:12.5px;line-height:1.35;color:var(--text)}
.cmpcell figcaption b{display:block;font-weight:600}
.cmpcell figcaption span{display:block;margin-top:3px;font-size:11.5px;
  line-height:1.4;color:var(--text-dim)}
.cmpcell figcaption .alt{font-weight:400;color:var(--text-dim)}
.cmpcell.is-ok{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.cmpcell figcaption i{display:block;font-style:normal;font-weight:600;font-size:10.5px;
  letter-spacing:.07em;text-transform:uppercase;color:var(--ok);margin-top:2px}

/* one option's structure, beside its explanation */
.wrow{align-items:flex-start}
.wfig{flex:0 0 auto;margin-left:10px;padding:5px 6px;background:#fff;
  border:1px solid var(--line-soft);border-radius:6px;display:grid;place-items:center;
  min-width:64px}
.wfig svg{max-width:100%;height:auto;color:var(--text)}
@media (max-width:620px){
  .wrow{flex-wrap:wrap}
  .wfig{margin:7px 0 0 26px}
}
.teach .fgshow{background:#fff;border-color:#CFDDF0;margin-bottom:11px}

/* ---------- functional group atlas ---------- */
.atbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--paper);
  border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;margin-bottom:16px;
  position:sticky;top:88px;z-index:30}
.atbar input{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:7px;
  padding:6px 10px;width:190px;background:var(--paper);color:var(--text)}
.atbar .spacer{flex:1}
.atboard{margin-bottom:30px;scroll-margin-top:150px}
.atboard h3{border-top:2px solid var(--ink);padding-top:12px;margin:0 0 4px}
.atboard .bintro{font-size:13.5px;color:var(--text-dim);margin:0 0 14px;max-width:44rem}
.atsub{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--text-dim);
  border-bottom:1px solid var(--line-soft);padding-bottom:5px;margin:18px 0 11px}
.atgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:11px}
.attile{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px;
  display:flex;flex-direction:column;gap:7px}
.attile[hidden]{display:none}
.atfig{display:grid;place-items:center;min-height:92px;background:var(--surface);
  border-radius:5px;padding:7px;position:relative}
.atfig svg{max-width:100%;height:auto;display:block;color:var(--text)}
.atname{font-size:14px;font-weight:600;line-height:1.25}
.atname .alt{font-weight:400;color:var(--text-dim)}
.attell{font-size:12.5px;line-height:1.45;color:var(--text-dim);margin:0}
.attell b{color:var(--text);font-weight:600}
.ateg{font-size:11px;color:var(--text-dim);margin:0;font-style:italic}
.ateg::before{content:"e.g. ";opacity:.7}
.atnote{border-left:3px solid var(--accent);padding:3px 0 3px 13px;margin:16px 0 0;
  font-size:14px;color:var(--text);max-width:44rem;background:var(--accent-bg);
  border-radius:0 6px 6px 0;padding-right:12px;padding-top:9px;padding-bottom:9px}
.attell code,.atnote code,.bintro code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:.88em;background:var(--surface);padding:1px 4px;border-radius:3px;color:var(--text)}
/* Recall mode collapses the text rather than just hiding it. Leaving the boxes
   at full height puts a screen of white space between the structures, which is
   the opposite of what going along a row quickly needs. */
#v-atlas.namesoff .atgrid{align-items:start}
#v-atlas.namesoff .atname,#v-atlas.namesoff .attell,#v-atlas.namesoff .ateg{display:none}
#v-atlas.namesoff .attile.shown .atname,#v-atlas.namesoff .attile.shown .attell{display:block}
#v-atlas.namesoff .attile.shown .ateg{display:block}
#v-atlas.namesoff .atfig{cursor:pointer}
#v-atlas.namesoff .atfig::after{content:"name it";position:absolute;bottom:3px;right:7px;
  font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
#v-atlas.namesoff .attile.shown .atfig::after{content:""}
/* objective guides */
.gobj{margin:0 0 34px;padding:0 0 22px;border-bottom:2px solid var(--line)}
.gobj h3{margin:26px 0 10px;font-size:19px}
.gobj h4{margin:20px 0 8px;font-size:14.5px;color:var(--accent);letter-spacing:.01em}
.gbar{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;background:var(--accent);color:#fff;border-radius:8px;padding:9px 14px;margin:0 0 6px}
.gbar span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.gbar b{font-size:15px}
.gbar i{margin-left:auto;font-size:12.5px;opacity:.9}

.gpt li{margin:3px 0;font-size:14.5px;line-height:1.5}
.gtell{border:1px solid;border-radius:9px;padding:11px 14px;margin:14px 0;font-size:14px;line-height:1.55;border-color:#7a5cc4;background:rgba(122,92,196,.07)}

.gtell ul,.gpoll ul,.ghook ul{margin:4px 0 4px 18px;padding:0}
.gtell li,.gpoll li,.ghook li{margin:3px 0}
.ghook,.gpoll,.gask{border:1px solid;border-radius:9px;padding:11px 14px;margin:14px 0;font-size:14px;line-height:1.55}

.gpoll{border-color:#3b62c4;background:rgba(59,98,196,.07)}

.ghook>b,.gpoll>b,.gask>b{display:block;margin-bottom:4px}

.gask li{margin:3px 0}
@media (max-width:600px){.gwords{grid-template-columns:1fr}.gwords dd{margin:0 0 6px 10px}}
/* labels on a question card, typed question kinds */
.lbl{font-size:11.5px;color:var(--text-dim);border:1px solid var(--line-soft);border-radius:999px;padding:1px 8px;white-space:nowrap}
.lbl.kind{background:var(--surface)}
.numin{display:flex;align-items:center;gap:10px;margin:14px 0 6px}
.numin input{font:inherit;font-size:17px;padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;width:180px;max-width:60%}
.numin .units{font-size:15px;color:var(--text-dim)}
.steps{margin:10px 0 6px;padding-left:22px}
.steps li{margin:6px 0}
.steps .stepk{display:inline-block;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--text-dim);width:118px}
.steps code{font-size:14px;background:var(--surface);padding:2px 6px;border-radius:5px}
.steps .stepwhy,.matchtab .stepwhy{display:block;font-size:13px;color:var(--text-dim);margin:3px 0 0}
.misspick{display:flex;flex-wrap:wrap;gap:6px}
.matchtab select{font:inherit;font-size:14px;padding:6px 8px;border:1.5px solid var(--line);border-radius:7px;max-width:100%;background:var(--paper)}
.matchtab s{color:var(--bad)}
.refnav-wrap{margin:0 0 20px;border:1px solid var(--line-soft);border-radius:8px;background:var(--surface)}
.refnav-wrap summary{cursor:pointer;padding:10px 14px;font-size:13.5px;font-weight:600;color:var(--accent);list-style:none}
.refnav-wrap summary::-webkit-details-marker{display:none}
.refnav-wrap summary::before{content:"\25B8  ";font-size:11px}
.refnav-wrap[open] summary::before{content:"\25BE  "}
.refnav{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:4px 14px 14px}
.refnav a{font-size:12.5px;padding:4px 9px;border:1px solid var(--line);border-radius:999px;
  background:var(--paper);color:var(--text);text-decoration:none;max-width:100%}
.refnav a:hover{background:var(--line-soft)}
.reffig{margin:0 0 20px;padding:0}
.reffig img{width:100%;max-width:760px;display:block;border:1px solid var(--line-soft);border-radius:6px;background:#fff}
.reffig figcaption{font-size:12.5px;color:var(--text-dim);margin-top:6px}
#v-ref h3{scroll-margin-top:12px}
/* Wide tables and long unbroken text in the reading tabs, on a narrow screen:
   a table sits in a box of its own (boxTables in views.js) that scrolls
   sideways when the table is wider than the screen, so the page never does;
   a word or link longer than its line breaks instead of running off it, and a
   jump-list chip (.refnav a) longer than the line wraps. */
.tscroll{overflow-x:auto;max-width:100%}
#v-guide,#v-tell,#v-ref{overflow-wrap:break-word}
input[type=text]{font:inherit;padding:8px 11px;border:1px solid var(--line);border-radius:7px;background:var(--paper);color:var(--text)}
.kbd{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:1px 5px}

/* ---------- panel: the plain box the newer views are built from ---------- */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;margin:0 0 14px}
.panel .row{display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.panel .spread{justify-content:space-between}
.meta{font-size:13px;color:var(--text-dim)}
.stamp{font-size:12.5px;color:var(--text-dim);margin:-10px 0 16px}

/* ---------- What's new (the change log the build embeds) ---------- */
.news{border-left:4px solid var(--accent)}
.news ul{margin:7px 0 9px;padding-left:20px;font-size:14px}
.news li{margin:3px 0}

/* ---------- session dots: one per answer, filled when solid ---------- */
.sdots10{display:inline-flex;gap:3px;vertical-align:middle;flex-wrap:wrap}
.sdots10 i{width:9px;height:9px;border-radius:50%;display:inline-block;border:1.5px solid var(--ok);background:var(--ok)}
.sdots10 i.n{background:transparent;border-color:var(--bad)}
.sdots10.big i{width:14px;height:14px}

/* ---------- Weak spots review plan ---------- */
.plan .pconcept{border-top:1px solid var(--line-soft);padding:9px 0 6px;margin-top:9px;font-size:14px}
.plan .pq{font-weight:600;margin-bottom:4px}
.plan .pw{color:var(--bad);margin:3px 0}
.plan .pw .meta{color:var(--text-dim)}
.plan .pr{color:var(--ok);margin:3px 0}
.plan .pi{margin:3px 0}

/* ---------- figures drawn as SVG (diagrams.js) ---------- */
.fig{margin:10px 0;padding:8px 8px 4px;border:1px solid var(--line);border-radius:8px;background:var(--paper);max-width:520px}
.fig svg{width:100%;height:auto;display:block;font:12px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.fig figcaption{font-size:13px;color:var(--text-dim);margin:6px 2px 4px}
.fig .title{fill:var(--text);font-size:11px;font-weight:700}
.fig .lbl{fill:var(--text);font-size:11px}
.fig .lbl.sm{font-size:10px;font-weight:600}
.fig .lbl.xs{font-size:8.5px;fill:var(--text-dim)}
.fig .box,.fig .shape{fill:var(--surface);stroke:var(--line);stroke-width:1.4}
.fig .ax{stroke:var(--text);stroke-width:1.2;fill:none}
.fig .arrow{stroke:var(--text-dim);stroke-width:1.6;fill:none;marker-end:url(#arw)}
.fig .mark{fill:var(--accent)}
.fig .cl{font-size:11px;font-weight:600;fill:var(--accent)}

/* ---------- step-through figures ----------
   One SVG group per step; only the active one is displayed. stepTo() sets the
   end state and these rules do the motion: a shape that is in both steps
   glides, a new one fades in, and a removed one fades out from a ghost copy of
   the old step. The fade-in animates opacity from 0 only, so a shape drawn at
   0.45 opacity does not turn solid. */
.fig .st{display:none}
.fig .st.on{display:inline}
.fig .st-out{pointer-events:none;animation:stOut .5s ease forwards}
.fig .st .fadein{animation:stIn .5s ease backwards}
.fig .st .glide{transition:transform .9s ease}
@keyframes stIn{from{opacity:0}}
@keyframes stOut{to{opacity:0}}
.sdots{display:inline-flex;gap:6px;align-items:center;margin-left:auto}
.sdot{width:12px;height:12px;border-radius:50%;background:var(--line);border:none;padding:0;cursor:pointer}
.sdot.on{background:var(--accent)}
.sdot:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.anim{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0 2px}
.anim .btn{padding:5px 10px;font-size:13px}

/* ---------- Diagrams tab ---------- */
.diagrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px;margin:8px 0 22px}
.diagrid .fig{max-width:none;margin:0}
.diagrid>div{scroll-margin-top:150px}

/* ---------- Explain one: a card under a table, for one row at a time ---------- */
.xpick{margin:11px 0}
.xpick select{font:inherit;font-size:14px;padding:5px 7px;border:1px solid var(--line);
  border-radius:6px;background:var(--paper);color:var(--text);max-width:100%}
.xpick .xout:empty{display:none}
.xpick .xout{margin-top:9px}
.whybtn{font:inherit;font-size:12px;padding:2px 8px;border:1px solid var(--line);
  border-radius:999px;background:var(--surface);color:var(--accent)}

/* floating buttons: a jump back to where a link was followed from, and a jump
   back to the explanation a figure was reached from. They stack rather than
   cover each other when both are up. */
#backbtn{position:fixed;right:14px;bottom:14px;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.25)}
#xback{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;white-space:nowrap;
  z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.25)}
body:has(#backbtn) #xback{bottom:64px}
/* a matching question's dropdowns have to fit a phone */
.matchtab select,select[data-row]{max-width:100%;min-width:0;flex:1 1 220px}
@media (max-width:560px){
  main{padding:14px 11px 80px}
  .stem{font-size:16px}
  header h1{font-size:13.5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
:focus-visible{outline:3px solid #6FA0E8;outline-offset:2px}
</style>

<body>

<header>
  <h1 id="courseTitle">Exam drill</h1>
  <div class="who">
    <span id="whoName">—</span>
    <button id="btnWho">Switch</button>
  </div>
</header>

<nav id="nav">
  <button data-v="topics" aria-selected="true">Topics</button>
  <button data-v="quiz">Quiz</button>
  <button data-v="gaps">Weak spots</button>
  <button data-v="exam">Exam sim</button>
  <button data-v="atlas">Atlas</button>
  <button data-v="diagrams">Diagrams</button>
  <button data-v="guide">Guides</button>
  <button data-v="tell">Tell apart</button>
  <button data-v="ref">Reference</button>
  <button data-v="settings">Settings</button>
</nav>

<main>
  <section id="v-topics"></section>
  <section id="v-quiz" class="hide"></section>
  <section id="v-gaps" class="hide"></section>
  <section id="v-exam" class="hide"></section>
  <section id="v-atlas" class="hide"></section>
  <section id="v-diagrams" class="hide"></section>
  <section id="v-guide" class="hide"></section>
  <section id="v-tell" class="hide"></section>
  <section id="v-ref" class="hide"></section>
  <section id="v-settings" class="hide"></section>
</main>

<script>
/*__SCHEDULER_LIB__*/
/* ==========================================================================
   DATA  (injected at build time)
   ========================================================================== */
/*__COURSE__*/
/* stamp: when this file was built, as shown. built: the same moment in UTC,
   compared with version.json to tell whether a newer build is published.
   questions: QUESTIONS.length as the build counted it (test.js checks they
   agree); images: the number of slide crops in images.json. changelog: CHANGELOG.md parsed into [{date, items:[…]}], newest first, which
   the Topics page shows as "What's new" since this browser last marked an
   entry seen, and Settings shows whole. preview: true in a page built with
   `build.py --preview`, which is served at /preview/ beside the live drill. */
const BUILD = /*__BUILD__*/{stamp:'', built:'', questions:0, images:0, changelog:[], preview:false};
const IMAGES = /*__IMAGES__*/{};
const QUESTIONS = /*__QUESTIONS__*/[];
const TOPICS = /*__TOPICS__*/[];
/* Which exam the simulator and the weighted pass follow, and its pools. A pool
   filter is an object of field:value; an array value means "one of". */
const EXAM = COURSE.exams.find(e => e.id === COURSE.activeExam) || COURSE.exams[0];
/* Fields a pool filter may name: any question field, plus exam, module and
   lecture, which come from the lecture the question's citation names. */
const fieldOf = (q, k) => (k === 'exam' || k === 'module') ? (lecOf(q) || {})[k] : k === 'lecture' ? (lecOf(q) || {}).id : q[k];
const poolFilter = f => q => Object.entries(f).every(([k, v]) => Array.isArray(v) ? v.includes(fieldOf(q, k)) : fieldOf(q, k) === v);
EXAM.pools.forEach(p => { p.test = poolFilter(p.filter); });
const poolOf = q => EXAM.pools.find(p => p.test(q));
/* The lecture a question comes from, read from the deck its citation names. */
const lecOf = q => {
  if(q._lec !== undefined) return q._lec;
  const c = q.cite || '';
  return (q._lec = COURSE.lectures.find(l => c.includes(l.deck)) || null);
};
const examLabel = q => { const l = lecOf(q); if(!l) return '';
  return `Exam ${l.exam} · ${l.module}`; };

/* ==========================================================================
   STORAGE — namespaced per profile so several people can share one browser
   ========================================================================== */
/* A preview (build.py --preview, served at /preview/ on the same origin as the
   live drill) keeps everything under its own namespace, so opening a preview and
   answering questions in it never changes the live drill's saved progress. */
const NS = COURSE.ns + (BUILD.preview ? '-preview' : '');

/* localStorage is not always reachable. Opening this file from disk can give
   the page an opaque origin, and a private window or blocked site data does the
   same, in which case even reading localStorage throws a SecurityError. That
   throw used to happen while the script was still evaluating, which killed the
   whole app and left a blank page. Everything goes through `store`, so the drill
   still runs when storage is unavailable.

   A write can also fail later in a visit that started with working storage:
   the origin's quota is full (every drill on lglouis3-create.github.io shares
   one origin, and so one quota). The template's shim probed once at load, so a
   later failed write was kept in memory but every read still went to
   localStorage and returned the old value. `store` (Intro-Pharmacology,
   exam1-drill/src/app.js) tracks each key whose last write failed and serves it
   from memory until a write succeeds, so nothing is lost within the visit, and
   the first failure shows one notice that points to Export progress. */
const MEM = {}, FAILED = new Set();   // FAILED: keys whose last write the browser refused; their value lives in MEM
const store = {
  get(k){
    if(FAILED.has(k)) return MEM[k] === undefined ? null : MEM[k];
    try { const v = localStorage.getItem(k); return v === null ? (MEM[k] === undefined ? null : MEM[k]) : v; }
    catch(e){ return MEM[k] === undefined ? null : MEM[k]; }
  },
  // true when the browser kept it; false when storage is full or blocked (it is then kept for this visit only)
  set(k, v){
    MEM[k] = v;
    try { localStorage.setItem(k, v); FAILED.delete(k); return true; }
    catch(e){ FAILED.add(k); saveWarn(); return false; }
  },
  del(k){ delete MEM[k]; FAILED.delete(k); try { localStorage.removeItem(k); } catch(e){ /* nothing to remove */ } },
};
/* The first time a preview opens in a browser, it copies the live drill's saved
   keys into its own namespace, so the preview shows the student's real progress.
   It only reads the live keys; it never writes or removes one. */
if(BUILD.preview){
  try {
    const live = COURSE.ns + ':', mine = NS + ':', keys = [];
    let copied = false;
    for(let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if(k.startsWith(mine)) copied = true;
      else if(k.startsWith(live)) keys.push(k);
    }
    if(!copied) keys.forEach(k => store.set(mine + k.slice(live.length), localStorage.getItem(k)));
  } catch(e){ /* storage unreadable: the preview starts empty */ }
}
/* Progress that cannot be saved would be lost on reload without a word: say so
   once, and point to the export. */
let SAVE_WARNED = false;
function saveWarn(){
  if(SAVE_WARNED) return;
  if(!document.body){ document.addEventListener('DOMContentLoaded', saveWarn, {once: true}); return; }
  SAVE_WARNED = true;
  const d = document.createElement('div');
  d.id = 'savewarn'; d.setAttribute('role', 'alert');
  d.innerHTML = 'This browser did not save your progress (storage is full or blocked). It is kept until you close or reload this page. To keep a copy, open <b>Settings</b> and use <b>Export progress</b>. <button type="button" class="btn ghost">OK</button>';
  d.querySelector('button').onclick = () => d.remove();
  document.body.appendChild(d);
}

let PROFILE = store.get(NS + ':profile') || '';
const keyFor = p => NS + ':data:' + p;

const BLANK = () => ({
  v:2,                // the shape's version (upgradeDB); a save without it is from before 2026-11-01
  concepts:{},        // conceptId -> {seen,correct,wrong,guessed,streak,box,dueAt,dueQ,lastQ,asked:[],
                      //               last:{qid: qn when last shown}, check?:{day}}
  answers:[],         // {qid,concept,result,at,qn,picked,ms}
                      //   picked: option index, or a sorted array of indices for a
                      //   select-all question; ms: time from render to answer.
                      //   Which wrong option was chosen is the most diagnostic
                      //   signal the app has, so it is kept.
  qn:0,               // questions answered counter (drives cram scheduling)
  fsrsQ:{},           // scheduler.model 'fsrs': question id -> ts-fsrs card (dates in ms)
  fsrsC:{},           // 'concept-fsrs': concept id -> ts-fsrs card
  arms:{},            // the comparison: concept id -> 'concept' | 'concept-fsrs', from its first answer
  fsUndo:null,        // the card before the last FSRS step, for "I guessed"
  settings:{mode:'cram'},
  created:Date.now()
});
let DB = BLANK();

/* Saved progress from an earlier core. The scheduler work of 2026-11-01 only
   added to the shape: question ids, `ns`, and every field a save already
   has keep their names and meaning. A save without `v` (version 1) gets
   the new top-level fields (fsrsQ, fsrsC, arms, fsUndo) from BLANK, and each
   concept gets `last`, rebuilt from the answers kept (the latest answer
   count at which each question was shown). Nothing else is changed. The
   same conversion runs on Import progress. */
function upgradeDB(raw){
  const old = !(raw && raw.v >= 2);
  const db = Object.assign(BLANK(), raw || {});
  if(old){
    for(const a of db.answers || []){
      const s = a && db.concepts[a.concept];
      if(!s || typeof a.qn !== 'number') continue;
      s.last = s.last || {};
      if(!(a.qid in s.last) || s.last[a.qid] < a.qn) s.last[a.qid] = a.qn;
    }
    db.v = 2;
  }
  return db;
}
function load(){
  if(!PROFILE) return;
  try{
    const raw = store.get(keyFor(PROFILE));
    DB = raw ? upgradeDB(JSON.parse(raw)) : BLANK();
  }catch(e){ DB = BLANK(); }
  loadLog();
  fsFromHistory();
}

/* ==========================================================================
   ANSWER HISTORY
   ==========================================================================
   One entry per answer, kept so the approved scheduler work (the kit's
   review/scheduler-proposal.md §4-§5) can compare schedulers and fit a memory
   model to this student's own answers. Ported from BDK (assets/app.js:
   LOG_KEY, cardCode, logAnswer, mergeLog, saveLog). An entry is

     [time in seconds, question code, 1 right / 0 wrong, mode, concept,
      confidence, item type, scheduler, arm, predicted recall]

   question code  FNV-1a hash of the question id, 8 hex digits; ids are
                  recovered by hashing the current bank
   mode           'quiz' (the scheduler picked it), 'sweep' (a fixed pass),
                  'exam' (a paper)
   concept        the question's concept id, which the scheduler works on
   confidence     'knew' (a right answer left as it was: Next counts as
                  "Knew it"), 'unsure' ("Not sure"), 'guessed' ("I guessed"),
                  'sure' ("I was sure of that" on a miss), or '' when none
                  was given (a miss left as it was, an exam paper)
   item type      'mc', 'multi' (select all), 'numeric', 'match'
   scheduler      the model that schedules the question's concept and, in
                  mode 'quiz', picked the question: 'concept', 'fsrs' or
                  'concept-fsrs' (scheduler proposal §5)
   arm            the comparison arm the concept is assigned to, or '' when
                  the course runs no comparison
   predicted recall  the probability of a right answer that the model in
                  use gave at that moment, before this answer updated it;
                  null for the concept scheduler, which predicts none

   The first seven fields are as they were, so entries written before the
   last three were added (and BDK's four) still read the same way.

   The history has its own key per profile, apart from the progress, so it
   never stops progress from saving: when the browser refuses the write, the
   oldest half is dropped and no notice is shown for it. DB.answers stays as it
   was; the scheduler and Weak spots read that, not this. */
const LOG_MAX = 20000;
const logKey = () => NS + ':log:' + PROFILE;
const cardCode = id => {
  let h = 0x811c9dc5;
  for(let i = 0; i < id.length; i++){ h ^= id.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return (h >>> 0).toString(16).padStart(8, '0');
};
let LOG = [];
function loadLog(){
  try { const v = JSON.parse(localStorage.getItem(logKey()) || '[]'); LOG = Array.isArray(v) ? v : []; }
  catch(e){ LOG = []; }
}
function saveLog(){
  for(;;){
    try { localStorage.setItem(logKey(), JSON.stringify(LOG)); return; }
    catch(e){ if(LOG.length < 100) return; LOG.splice(0, Math.ceil(LOG.length / 2)); }
  }
}
const itemType = q => q.type || (q.multi ? 'multi' : 'mc');
function logAnswer(q, result, mode, how){
  const conf = result === 'guessed' ? 'guessed' : (result === 'correct' && mode !== 'exam' ? 'knew' : '');
  how = how || {};
  const recall = typeof how.recall === 'number' && isFinite(how.recall) ? Math.round(how.recall * 10000) / 10000 : null;
  LOG.push([Math.round(Date.now() / 1000), cardCode(q.id), result === 'wrong' ? 0 : 1, mode, q.concept, conf, itemType(q),
            how.model || 'concept', how.arm || '', recall]);
  if(LOG.length > LOG_MAX) LOG.splice(0, LOG.length - LOG_MAX);
  saveLog();
}
/* "Not sure" and "I guessed" come after the answer is logged; they change the
   confidence on that answer's entry. */
function logConf(q, conf){
  const code = cardCode(q.id);
  for(let i = LOG.length - 1; i >= 0; i--) if(LOG[i][1] === code){ LOG[i][5] = conf; break; }
  saveLog();
}
/* An imported entry is the same answer as one already here when its second,
   question, result and mode match. BDK matched on second and question alone,
   which merges two answers to one question given in the same second in
   different modes or with different results (history_test.js answers that
   fast). The confidence is not part of the match: it can change after an
   export, and the answer is still the same one. Entries of either length
   merge: when the copy here is the shorter (written before the scheduler
   fields were added) and the imported copy of the same answer carries them,
   the copy here gains those fields; nothing it already has is changed. */
function mergeLog(entries){
  const key = e => e.slice(0, 4).join('|');
  const here = new Map(LOG.map(e => [key(e), e]));
  for(const e of entries){
    if(!Array.isArray(e) || e.length < 3) continue;
    const k = key(e), mine = here.get(k);

}
/* Which profile opens when no choice is stored: the one with saved progress used
   most recently (by its last answer, else when it was created), else 'me'. The
   site opens straight to the drill and never asks for a name on its own (Louis,
   2026-11-01); the Switch button at the top still asks, for a shared browser. */

  const pre = NS + ':data:';
  let best = '', bestAt = -1;
  try {
    for(let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if(!k || !k.startsWith(pre) || k.length === pre.length) continue;
      let at = 0;
      try {
        const d = JSON.parse(localStorage.getItem(k)) || {};
        const a = Array.isArray(d.answers) ? d.answers : [];
        at = a.length ? (Number(a[a.length - 1].at) || 0) : (Number(d.created) || 0);
      } catch(e){ /* unreadable save: still a profile, ranked last */ }

  // profile's progress and drop this one's last answer.

  let n = PROFILE;
  if(!force && !n) n = pickProfile();
  if(force){
    n = (prompt(
      'Your name or initials.\n\n'+
      'This keeps your progress separate from anyone else using this same browser. '+
      'Nothing is sent anywhere — it stays on this device.', PROFILE||'') || '').trim();

     2 wrong    -> stays in active review, resurfaces after >=GAP other questions,
                   prefers a DIFFERENT question on the same concept
     3 guessed  -> treated as not-yet-understood: box drops to 0 so it ranks
                   with missed concepts, ahead of never-seen material
     4 spaced   -> mastered material returns at growing intervals
     5 priority -> wrong > due > never-seen > recently mastered
     6 concept-level tracking, not wording-level
     7 mastery  -> needs repeated correct answers on separate occasions
     8 sure and wrong -> "I was sure of that" on a miss: a different question
                   on the concept comes next, and the concept is due on every
                   later day until it is answered right on a later calendar

const GAP = 4;                                   // min other questions before a missed concept returns

   'concept-fsrs' (FSRS-7 per concept with question rotation, §4.3; it ships
   with the comparison of §5 on, so compare is true unless set to false).
   preset 'calc' is the calculation preset (§4.1.3); see pickNext. A model

   build that names an unknown model, so this is not expected). */

  const c = COURSE.scheduler || {};
  const wants = ['concept', 'fsrs', 'concept-fsrs'].includes(c.model) ? c.model : 'concept';

  weekly:   {by:'days', steps:[0, 1, 2, 4, 7, 10, 14], label:'Weekly exams',

  semester: {by:'days', steps:[0, 1, 3, 7, 14, 30, 60], label:'Semester',

const BY_CONCEPT = {};

  const was = SCHED.calc && byId(notId) ? skillOf(byId(notId)) : null;
  const same = q => was !== null && skillOf(q) === was ? 1 : 0;
  c = c.map(q => ({q, k: same(q), w: when(q), r: Math.random()})).sort((a, b) => a.k - b.k || a.w - b.w || a.r - b.r);
  return c[0].q;
}

/* Select-all questions carry more than one correct option and are marked
   all-or-nothing, which is how a select-all item is scored on the paper. */
const isMulti = q => !!q.multi;
const correctSet = q => q.options.map((o,i) => o.correct ? i : -1).filter(i => i >= 0);
function gradeMulti(q, picks){
  const want = correctSet(q), got = (picks || []).slice().sort((a,b)=>a-b);
  return want.length === got.length && want.every((v,i) => v === got[i]);
}

/** Rank one candidate question. Higher score = ask sooner. */
function score(q){
  const s = DB.concepts[q.concept];
  if(!s) return {tier:3, sub:0};                       // never tested
  const cooled = (DB.qn - s.lastQ) >= GAP;
  // rule 8: a confident error's check, on a later day, ranks with the misses
  if(checkDue(s)) return cooled ? {tier:4, sub: s.wrong*10 + s.guessed*5} : null;
  if(s.box === 0 && s.seen > 0){                       // missed / unresolved
    if(!cooled) return null;                           // too soon — rule 2
    return {tier:4, sub: s.wrong*10 + s.guessed*5};
  }
  if(isDue(s)) return {tier:2, sub: 6 - s.box};        // due for spaced review
  // Answered correctly and not yet due. Rule 1 says do not repeat it. Only the
  // explicit "Ask everything" setting overrides that, and then oldest-first.
  if((DB.settings.mode||'cram') !== 'all') return null;
  return {tier:1, sub: -s.lastQ};
}

/**
 * Pick the next question from a pool.
 * Prefers a question on the concept that has NOT been asked before (rule 2/6:
 * re-test the concept with different wording rather than the identical item).
 */
/* Calculation preset (scheduler proposal §4.1.3, its references 16 and 17 on
   interleaving): due questions from earlier lectures stay in the mix. With
   the preset, a quiz on part of the bank also draws the questions of earlier
   lectures (lectures listed before the latest lecture the pool covers) that
   are not in the pool, but only while their concept is due or missed. */
const lecIndex = q => { const l = lecOf(q); return l ? COURSE.lectures.indexOf(l) : -1; };
function earlierDue(pool){
  const top = Math.max(-1, ...pool.map(lecIndex));
  const inPool = new Set(pool.map(q => q.id));
  return QUESTIONS.filter(q => !inPool.has(q.id) && lecIndex(q) >= 0 && lecIndex(q) < top);
}
function pickNext(pool, justAsked){
  let cands = [];
  const now = Date.now();
  const add = (q, earlier) => {
    if(justAsked && q.id === justAsked) return;
    const arm = armOf(q.concept);
    const sc = arm === 'concept' ? score(q) : fsScore(q, arm, now);
    if(!sc) return;
    const due = arm === 'concept' ? (sc.tier === 2 || sc.tier === 4) : sc.due;
    if(earlier && !due) return;                       // earlier lectures: due or missed only
    const s = DB.concepts[q.concept];
    const fresh = !s || !s.asked.includes(q.id);       // unseen wording of this concept
    // calculation preset: a due review ranks with never-seen material (tier 3)
    // instead of after it, so earlier material is mixed in rather than waiting
    cands.push({q, arm, due, tier: arm === 'concept' && SCHED.calc && sc.tier === 2 ? 3 : sc.tier, sub:sc.sub, fresh:fresh?1:0, r:Math.random()});
  };
  for(const q of pool) add(q, false);
  if(SCHED.calc) for(const q of earlierDue(pool)) add(q, true);
  if(!cands.length) return null;
  // calculation preset: two questions in a row never share a skill when a
  // question of another skill is eligible
  const prev = SCHED.calc && justAsked ? byId(justAsked) : null;
  if(prev){
    const other = cands.filter(c => skillOf(c.q) !== skillOf(prev));
    if(other.length) cands = other;
  }
  // the comparison: the arm with fewer answers this session takes the turn
  if(SCHED.compare && cands.some(c => c.arm !== cands[0].arm)){
    const n = sessionArms(), a = n.concept, b = n['concept-fsrs'];
    const arm = a < b ? 'concept' : b < a ? 'concept-fsrs' : (Math.random() < 0.5 ? 'concept' : 'concept-fsrs');
    cands = cands.filter(c => c.arm === arm);
  }
  return cands[0].arm === 'concept' ? conceptPick(cands) : fsPick(cands);
}
/* The FSRS models' pick: the due card with the lowest predicted recall, else
   a question never answered (one of up to five, at random), else, with "Ask
   everything", the lowest recall. Under 'concept-fsrs' the card is the
   concept's, and the question shown is the concept's question seen least
   recently (one never shown first), so a concept answered with "Not sure"
   comes back as a different question when it has one (§4.3). */
function fsPick(cands){
  const due = cands.filter(c => c.due);
  let chosen;
  if(due.length) chosen = due.sort((a, b) => b.sub - a.sub || a.r - b.r)[0];
  else {
    const fresh = cands.filter(c => c.tier === 3).sort((a, b) => a.r - b.r);
    chosen = fresh.length ? fresh[Math.floor(Math.random() * Math.min(fresh.length, 5))]
                          : cands.sort((a, b) => b.sub - a.sub || a.r - b.r)[0];
  }
  if(chosen.arm !== 'concept-fsrs') return chosen.q;
  const s = DB.concepts[chosen.q.concept] || {}, last = s.last || {}, asked = s.asked || [];
  const when = q => q.id in last ? last[q.id] : asked.includes(q.id) ? 0 : -1;
  return cands.filter(c => c.q.concept === chosen.q.concept).sort((a, b) => when(a.q) - when(b.q) || a.r - b.r)[0].q;
}
/* The concept scheduler's pick from its ranked candidates. */
function conceptPick(cands){
  cands.sort((a,b)=>
      b.tier - a.tier
   || b.fresh - a.fresh
   || b.sub  - a.sub
   || a.r    - b.r);
  // sample from the top of the ranked list so the order is not identical every run
  let top = cands.filter(c => c.tier===cands[0].tier && c.fresh===cands[0].fresh);
  if(SCHED.calc && cands[0].tier === 3){
    // new and due material side by side: every tier-3 candidate, keeping the
    // unseen wordings of a concept when it has any, drawn from evenly
    const t3 = cands.filter(c => c.tier === 3);
    const withFresh = new Set(t3.filter(c => c.fresh).map(c => c.q.concept));
    top = t3.filter(c => c.fresh || !withFresh.has(c.q.concept));
    const pick = top[Math.floor(Math.random() * top.length)];
    LAST_TIER = pick.tier;
    return pick.q;
  }
  // Rule 5 puts a missed concept ahead of a never-seen one. Taken literally,
  // a pool with many open misses serves them back to back and the never-seen
  // material waits, so the "not yet seen" count in Weak spots stands still
  // while the retests cycle. A missed concept now takes at most every other
  // turn: after one retest the next pick goes to never-seen material when any
  // remains in the pool. The GAP rule still holds for each concept.
  if(cands[0].tier === 4 && LAST_TIER === 4){
    const unseen = cands.filter(c => c.tier === 3);
    if(unseen.length) top = unseen;
  }
  const pick = top[Math.floor(Math.random()*Math.min(top.length,5))];
  LAST_TIER = pick.tier;
  return pick.q;
}
let LAST_TIER = 0;   // tier of the question pickNext served last (4 = a missed concept's retest)

/* ==========================================================================
   HELPERS
   ========================================================================== */
const $  = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LETTERS = 'ABCDEFGHIJ';
const byId = id => QUESTIONS.find(q=>q.id===id);
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; };

function conceptsIn(pool){ return [...new Set(pool.map(q=>q.concept))]; }
/** Concepts in a pool that are still waiting: never seen, missed, or due again. */
function remainingIn(pool){
  let n = 0;
  const now = Date.now();
  for(const c of conceptsIn(pool)){
    const st = DB.concepts[c], arm = armOf(c);
    if(arm === 'concept'){ if(!st || !st.seen || st.box === 0 || isDue(st)) n++; }
    else if(pool.some(q => q.concept === c && fsWaiting(q, arm, now))) n++;
  }
  return n;
}
/* Under an FSRS model a question is waiting when it was never answered or
   its card is due. */
const fsWaiting = (q, arm, now) => { const c = fsCard(q, arm); return !c || now >= c.dueAt; };
function masteryOf(pool){
  const cs = conceptsIn(pool);
  let m=0, t=0;
  for(const c of cs){
    const s = DB.concepts[c];
    if(s && s.seen) t++;
    if(s && s.box >= MASTER_BOX) m++;
  }
  return {mastered:m, touched:t, total:cs.length};
}
/* Exam weight per question. Each pool in the manifest supplies a fixed number
   of marks on the paper. Dividing a pool's share of the paper by the number of
   questions in that pool gives the marks each one question stands for, which
   is what a miss actually costs. */
const BLUEPRINT = Object.fromEntries(EXAM.pools.map(p => [p.key, p.marks]));
const poolKey = q => { const p = poolOf(q); return p ? p.key : 'none'; };
const POOL_SIZE = (() => { const n = {}; QUESTIONS.forEach(q => { n[poolKey(q)] = (n[poolKey(q)]||0) + 1; }); return n; })();
function markWeight(q){
  const k = poolKey(q);
  return (BLUEPRINT[k] || 0) / (POOL_SIZE[k] || 1);
}

function profTag(p){
  const cls = ['sik','yen','p3','p4'][COURSE.professors.indexOf(p)] || 'p3';
  return `<span class="tag ${cls}">${esc(p)}</span>`;
}
</script>
